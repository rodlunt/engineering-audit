<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>engineering-audit: configuration received</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
</style>
</head>
<body>
<h1>Configuration received</h1>
<p>Keep this tab open. The audit is running in your terminal, and if it needs
your review of updated standards documents before writing them, this page
will take you there automatically.</p>

<script nonce="$csp_nonce">
// Polls for a standards approval becoming ready, and navigates this tab to
// it the moment one does. This tab is the only one a human still has open
// once the audit starts running, and nothing else (no email, no terminal
// bell a browser can act on) ever tells a real browser that the approval
// page exists: without this script, /approve-standards is unreachable by
// anyone who did not already know its exact URL (issue 05).
(function () {
  function poll() {
    fetch("$approval_ready_path", { cache: "no-store" })
      .then(function (response) {
        if (response.status === 204) {
          window.location.href = "$approval_page_path";
        }
      })
      .catch(function () {
        // Best effort only, same as the configuration page's own heartbeat:
        // a dropped poll here is not a reason to give up on the ones after
        // it, and there is nothing useful to show the user about a single
        // failed fetch.
      });
  }
  setInterval(poll, $approval_poll_interval_ms);
})();
</script>
</body>
</html>
