name: tag version guard

# A version tag whose tree claims a different package version is real drift:
# v0.2.0 was cut over a pyproject.toml still saying 0.1.0, so every report
# from that build stamped tool_version 0.1.0. Tags cannot be gated the way
# branches can, so this guard runs when the tag lands and goes red (GitHub
# emails on workflow failure) while the fix is still one commit away.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit digest, matching ci.yml: this repo should survive
      # its own audit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ -z "$version" ]; then
            # A guard that cannot read its input must fail, not pass.
            echo "could not extract version from pyproject.toml; guard broken, not a pass" >&2
            exit 2
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag points at a tree whose pyproject.toml says $version; bump the version or retag" >&2
            exit 1
          fi
          echo "tag v$tag matches pyproject version $version"

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    # Only produce an SBOM for a tag that already passed the version guard:
    # no point auditing a release build that is going to be retagged.
    needs: check-version
    # Needs write access to attach a release asset; every other job in this
    # workflow stays on the workflow-level read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sync runtime dependencies
        # --no-dev: the SBOM should describe what ships to users, not the
        # project's own test tooling.
        run: uv sync --frozen --no-dev
      - name: Generate SBOM (CycloneDX)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment .venv/bin/python \
            --of JSON \
            --output-reproducible \
            -o "sbom-${TAG}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom-*.cdx.json
      - name: Ensure a release exists, then attach the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # This step used to log "no release exists yet" and exit 0, on the
          # reasoning that the SBOM was still recoverable from the workflow
          # artifact above. That is detecting a problem and proceeding anyway,
          # which is the same as not detecting it, and it bit: v0.13.0 and
          # v0.14.0 both shipped with no SBOM and nothing said so until
          # somebody went looking three sessions later. The message was
          # written to a log that is only read when you already suspect the
          # thing it reports.
          #
          # So the step now creates the release rather than reporting its
          # absence. Notes are generated, because a release that exists with
          # ordinary notes can be rewritten by hand afterwards, whereas a
          # release that does not exist takes its SBOM with it. Anything that
          # fails from here is a real failure and exits non-zero.
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            echo "no release for $TAG: creating one with generated notes"
            # --verify-tag refuses to invent a tag if the ref ever disappears
            # between the push and this step.
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

          gh release upload "$TAG" "sbom-${TAG}.cdx.json" --repo "$GITHUB_REPOSITORY" --clobber
          echo "attached SBOM to release $TAG"
