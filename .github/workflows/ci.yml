name: ci

on:
  push:
    branches: [main]
  # Deliberately unfiltered: every pull request is checked, whatever it
  # targets. With `branches: [main]` here, a PR stacked on another branch
  # ran no checks at all, and GitHub reported it as mergeable with
  # mergeStateStatus CLEAN and statusCheckRollup empty. That is not a
  # missing check that looks missing, it is a missing check that looks like
  # a passing one, which is the failure this repository's own hardening
  # notes keep describing. Observed on PR #279, stacked on #278.
  #
  # The push trigger stays main-only on purpose: this only needs to widen
  # for pull requests, and unfiltering push as well would run the whole
  # suite on every branch push, including the ones a PR is about to check
  # anyway.
  pull_request:

# Read-only by default: this workflow only checks out code, installs
# dependencies and runs lint/type/test steps, so it never needs to write
# back to the repo. Matches tag-version-guard.yml rather than inheriting
# whatever the org or repo default happens to be.
permissions:
  contents: read

# Cancel a run that a newer push on the same ref has already superseded,
# instead of leaving it queued to report a stale result after the fact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit digests, not mutable tags: the rules pack this tool
      # serves flags tag-pinned actions, and this repo should survive its own
      # audit. Comments record the human-readable version each digest is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. tests/test_social_card_currency.py dates committed
          # image assets against what they are pictures of, and on the default
          # shallow clone every path resolves to the same single commit, so the
          # comparison holds trivially and the guard reports success while
          # establishing nothing. It skips loudly on a shallow clone now, but
          # a guard that always skips in CI is not a guard.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Version pins match pyproject.toml
        # See issue #101: the Gemini extension manifest's own version pin
        # was missed across two releases. This is the control that replaces
        # the release checklist entry a human kept forgetting to honour.
        run: uv run python scripts/check-version-pins.py
      - name: Lint (ruff)
        # ruff and mypy run via pinned, ephemeral `--with` overlays rather
        # than declared dev dependencies, so these steps need no uv.lock
        # change.
        run: uv run --with ruff==0.15.16 ruff check .
      - name: Format check (ruff)
        # See issue #106: formatting was implied by the lint config but
        # never enforced. .git-blame-ignore-revs keeps `git blame` useful
        # across the one-off reformat commit that made this step pass.
        run: uv run --with ruff==0.15.16 ruff format --check .
      - name: Type-check (mypy)
        # Inside the required job on purpose: mypy went clean once the two
        # pre-existing findings were fixed (PR #67), so a new type error now
        # blocks the merge instead of going quietly red in a side job.
        run: uv run --with mypy==2.3.0 mypy src
      - name: Run tests
        # tests/conftest.py's autouse fixture already sets this for a local
        # run; it is set again here so CI does not depend on that fixture
        # being present, and so the intent (no live git ls-remote calls to
        # github.com from a shared runner, see issue #190) is visible in the
        # workflow itself.
        env:
          ENGINEERING_AUDIT_NO_UPDATE_CHECK: "1"
        run: uv run pytest -q
