name: Bug report
description: Something the tool did wrong; questions and ideas belong in Discussions.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two minutes on the fields below usually saves a
        week of back and forth.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the tool do, and what did you expect instead?
      placeholder: The report showed ... but the run had actually ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The steps you took, as close to exactly as you can manage.
      placeholder: |
        1. Registered the server against the taster pack
        2. Asked for an audit of ...
        3. Ticked domains ... on the configuration page
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: Tool version
      description: From the report footer ("Generated by engineering-audit vX.Y.Z"), or the tag in your registration command.
      placeholder: v0.9.0
    validations:
      required: true
  - type: input
    id: assistant
    attributes:
      label: Assistant and model
      description: Which assistant drove the run, and which model.
      placeholder: Claude Code, claude-sonnet-5
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Standalone audit
        - Inline decision-time checks
        - Not sure / other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error text, the odd part of the report, or terminal output. Redact anything from a private repository.
      render: text
