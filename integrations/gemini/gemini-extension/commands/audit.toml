description = "Run a full engineering-practice audit of this repository via the engineering-audit MCP server, producing a self-contained HTML report."

prompt = """
Follow the procedure in AUDIT.md from the engineering-audit repository this MCP
server was installed from. It is the source of truth for this audit; do not
