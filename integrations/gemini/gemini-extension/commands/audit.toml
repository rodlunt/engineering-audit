Summary: gather run metadata (repository name, HEAD commit, your own
assistant/model identity, an ISO 8601 started timestamp, and the host
environment as exactly {os, host_cli, host_cli_version}, omitting any key you
cannot determine and adding no others), call begin_run, call start_config (show
any interactive configuration URL as a clickable link, then call get_config
